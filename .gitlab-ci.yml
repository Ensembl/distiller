stages:
  - build
  - deploy-test
  - deploy-prod

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_IMAGE: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}

.branch-rules-main:
  rules:
    - if: '$CI_DEPLOY_FREEZE == null && $CI_COMMIT_BRANCH == "main"'
      when: on_success

.docker-build:
  image: docker
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t ${DOCKER_IMAGE} --no-cache .
    - docker push ${DOCKER_IMAGE}
    - docker rmi ${DOCKER_IMAGE}
    - docker logout $CI_REGISTRY

.deploy:
  image: dockerhub.ebi.ac.uk/ensembl-web/deploy-tools:latest
  before_script:
    - kubectl config use-context ${AGENT}
    - kubectl config set-context --current --namespace=${NS}
  script:
    - git clone --depth 1 --branch distiller https://gitlab.ebi.ac.uk/ensembl-web/ensembl-k8s-manifests.git
    - cd ensembl-k8s-manifests/ensembl-distiller
    - kustomize edit set image DOCKER_IMAGE=${DOCKER_IMAGE}
    - kubectl apply -k .
    - kubectl rollout status deployment/distiller-backend

.deploy-main:
  extends:
    - .deploy
    - .branch-rules-main

Docker:
  stage: build
  extends:
    - .docker-build
    - .branch-rules-main

Dev:
  stage: deploy-test
  extends: .deploy-main
  environment:
    name: development
    url: https://dev-2020.ensembl.org/api/distiller
  variables:
    AGENT: ${DEV_AGENT}
    NS: ${DEV_NS}

Staging:
  stage: deploy-test
  extends: .deploy-main
  environment:
    name: staging
  variables:
    AGENT: ${STAGING_AGENT}
    NS: ${STAGING_NS}

Prod:
  stage: deploy-prod
  extends: .deploy-main
  environment:
    name: production
  when: manual
  variables:
    AGENT: ${PROD_AGENT}
    NS: ${PROD_NS}
